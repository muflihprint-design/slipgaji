<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>E-Slip Gaji | VI PRINTING</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <main id="login-view" class="min-h-screen flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-8 border border-slate-100">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-blue-200">
                    <i data-lucide="printer" class="text-white w-8 h-8"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800 tracking-tight">VI PRINTING</h1>
                <p class="text-sm text-slate-500 mt-1">Portal E-Slip Gaji Karyawan</p>
            </div>

            <div id="login-error" class="hidden mb-4 bg-red-50 border-l-4 border-red-500 text-red-700 p-3 rounded text-sm flex items-start gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 mt-0.5 flex-shrink-0"></i>
                <span id="login-error-msg">Terjadi kesalahan.</span>
            </div>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Username / Nama</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="user" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <input type="text" id="username" required
                            class="pl-10 w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors outline-none"
                            placeholder="Masukkan Username / Nama">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-lucide="lock" class="w-5 h-5 text-slate-400"></i>
                        </div>
                        <input type="password" id="password" required
                            class="pl-10 pr-10 w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors outline-none"
                            placeholder="••••••••">
                        
                        <button type="button" id="toggle-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-blue-500 transition-colors focus:outline-none">
                            <i data-lucide="eye" id="icon-eye" class="w-5 h-5"></i>
                            <i data-lucide="eye-off" id="icon-eye-off" class="w-5 h-5 hidden"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" id="btn-login" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-colors flex items-center justify-center gap-2 shadow-md shadow-blue-200 mt-6">
                    <span id="btn-text">Masuk ke Portal</span>
                    <div id="btn-loader" class="loader hidden"></div>
                </button>
            </form>
            
            <p class="text-center text-xs text-slate-400 mt-6">Butuh bantuan? Hubungi Admin HRD.</p>
        </div>
    </main>

    <main id="dashboard-view" class="hidden min-h-screen bg-slate-50 pb-10">
        <nav class="bg-blue-600 text-white sticky top-0 z-10 shadow-md shadow-blue-900/5">
            <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i data-lucide="printer" class="w-5 h-5"></i>
                    <span class="font-semibold tracking-tight">VI PRINTING</span>
                </div>
                <button onclick="logout()" class="p-2 hover:bg-blue-700 rounded-full transition-colors" title="Logout">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </nav>

        <div class="max-w-md mx-auto px-4 mt-6 space-y-6">
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100 flex items-center gap-4">
                <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center text-xl font-bold shrink-0">
                    <span id="profile-initial">V</span>
                </div>
                <div>
                    <h2 id="profile-nama" class="text-lg font-bold text-slate-800 leading-tight">Nama Karyawan</h2>
                    <p class="text-sm text-slate-500 mt-0.5 flex items-center gap-1.5">
                        <i data-lucide="badge-check" class="w-4 h-4 text-green-500"></i>
                        <span id="profile-jabatan">Jabatan</span>
                        <span class="text-slate-300">•</span>
                        <span id="profile-noid" class="font-mono text-xs">ID000</span>
                    </p>
                </div>
            </div>

            <div class="flex items-center justify-between px-1">
                <h3 class="text-sm font-bold text-slate-700 uppercase tracking-wider">Riwayat Slip Gaji</h3>
                <span id="total-slip-badge" class="bg-slate-200 text-slate-600 text-xs font-bold px-2 py-1 rounded-full">0 Data</span>
            </div>

            <div id="slips-container" class="space-y-4"></div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw03mRWnKxRKTqz2pYBE7qRyXZpbZrToo4_bVXTT8H8jpw5IniHiQ1sg9bwTMQP8jfs5Q/exec";
        
        const viewLogin = document.getElementById('login-view');
        const viewDashboard = document.getElementById('dashboard-view');
        const formLogin = document.getElementById('login-form');
        const errorBanner = document.getElementById('login-error');
        const errorMsg = document.getElementById('login-error-msg');
        const btnText = document.getElementById('btn-text');
        const btnLoader = document.getElementById('btn-loader');
        const btnLogin = document.getElementById('btn-login');
        
        // Elemen toggle password
        const togglePasswordBtn = document.getElementById('toggle-password');
        const passwordInput = document.getElementById('password');
        const iconEye = document.getElementById('icon-eye');
        const iconEyeOff = document.getElementById('icon-eye-off');
        
        document.addEventListener("DOMContentLoaded", checkSession);

        // Fungsi Toggle Show/Hide Password
        togglePasswordBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                iconEye.classList.add('hidden');
                iconEyeOff.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                iconEye.classList.remove('hidden');
                iconEyeOff.classList.add('hidden');
            }
        });

        function checkSession() {
            const savedData = sessionStorage.getItem("vi_printing_session");
            if (savedData) {
                const data = JSON.parse(savedData);
                renderDashboard(data.user, data.slips);
                showView('dashboard');
            } else {
                showView('login');
            }
        }

        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if(APPS_SCRIPT_URL.includes("ISI_URL")) {
                showError("Error: Developer belum memasukkan URL Apps Script.");
                return;
            }

            setLoading(true);
            hideError();

            try {
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: "login", username: usernameInput, password: passwordInput })
                });

                if (!response.ok) throw new Error("Koneksi ke server gagal.");
                const result = await response.json();

                if (result.success) {
                    sessionStorage.setItem("vi_printing_session", JSON.stringify({ user: result.user, slips: result.slips }));
                    formLogin.reset();
                    renderDashboard(result.user, result.slips);
                    showView('dashboard');
                } else {
                    showError(result.message || "Login Gagal.");
                }
            } catch (error) {
                showError("Gagal terhubung ke server.");
            } finally {
                setLoading(false);
            }
        });

        function logout() {
            sessionStorage.removeItem("vi_printing_session");
            document.getElementById('slips-container').innerHTML = '';
            showView('login');
        }

        function showView(view) {
            if (view === 'login') {
                viewDashboard.classList.add('hidden');
                viewLogin.classList.remove('hidden');
            } else {
                viewLogin.classList.add('hidden');
                viewDashboard.classList.remove('hidden');
            }
        }

        function setLoading(isLoading) {
            if (isLoading) {
                btnLogin.disabled = true;
                btnLogin.classList.add('opacity-80', 'cursor-not-allowed');
                btnText.innerText = "Memverifikasi...";
                btnLoader.classList.remove('hidden');
            } else {
                btnLogin.disabled = false;
                btnLogin.classList.remove('opacity-80', 'cursor-not-allowed');
                btnText.innerText = "Masuk ke Portal";
                btnLoader.classList.add('hidden');
            }
        }

        function showError(message) {
            errorMsg.innerText = message;
            errorBanner.classList.remove('hidden');
        }

        function hideError() {
            errorBanner.classList.add('hidden');
        }

        function formatRupiah(number) {
            if (isNaN(number) || number === null || number === "") return "Rp 0";
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(number);
        }

        function formatPeriod(dateString) {
            const date = new Date(dateString);
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${months[date.getMonth()].toUpperCase()} ${date.getFullYear()}`;
        }

        function renderDashboard(user, slips) {
            document.getElementById('profile
